query GetMainnetHistoryElements(
    $pageCount: Int
    $cursor: Cursor
    $orderBy: [HistoryElementsOrderBy!]
    $filter: HistoryElementFilter
) {
    historyElements(
        first: $pageCount
        after: $cursor
        orderBy: $orderBy
        filter: $filter
    ) {
        nodes {
            id @catch(to: NULL)
            blockHash @catch(to: NULL)
            module @catch(to: NULL)
            method @catch(to: NULL)
            address @catch(to: NULL)
            networkFee @catch(to: NULL)
            execution @catch(to: NULL)
            timestamp @catch(to: NULL)
            data @catch(to: NULL)
        }
        pageInfo {
            endCursor
            hasNextPage
        }
    }
}