query GetFiatData(
    $pageCount: Int!,
    $cursor: Cursor!
) {
    entities:
        assets(
            first: $pageCount
            after: $cursor
        ) {
            nodes {
                id @catch(to: NULL)
                priceUSD @catch(to: NULL)
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
}