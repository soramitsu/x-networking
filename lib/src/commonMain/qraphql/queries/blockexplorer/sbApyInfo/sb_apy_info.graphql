query GetSbApyInfo($cursor: Cursor!) {
    data:
        poolXYKs(
            first: 100
            after: $cursor
            filter: { strategicBonusApy: { greaterThan: "0" } }
        ) {
            pageInfo {
                endCursor
                hasNextPage
            }
            edges {
                node {
                    id @catch(to: NULL)
                    strategicBonusApy @catch(to: NULL)
                }
            }
        }
}