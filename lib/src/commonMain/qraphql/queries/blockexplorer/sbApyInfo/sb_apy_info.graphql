query GetSbApyInfo($pageCount: Int!, $cursor: Cursor!) {
    entities:
        poolXYKs(
            first: $pageCount
            before: $cursor
        ) {
            nodes {
                id @catch(to: NULL)
                strategicBonusApy @catch(to: NULL)
            }
            pageInfo {
                endCursor
            }
        }
}